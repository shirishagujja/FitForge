services:
  # No need to expose Postgres/Redis on the host at all in production — only other
  # containers on the compose network talk to them. (The security group already blocks
  # these ports externally, but there's no reason to bind them on the host either.)
  db:
    ports: !reset []

  redis:
    ports: !reset []

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro

  # Not started by `up -d` (profile-gated) — invoked explicitly via
  # `docker compose run --rm certbot ...` for initial issuance and renewal.
  certbot:
    image: certbot/certbot
    profiles: ["tools"]
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot

volumes:
  certbot_certs:
  certbot_webroot:
